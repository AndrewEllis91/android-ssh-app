name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Prepare Signing Keystore
        id: prepare_keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Found custom signing secrets. Decoding keystore..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "No custom secrets provided. Generating release keystore..."
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.keystore" \
              -alias pissh \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "PiSSHRelease2026" \
              -keypass "PiSSHRelease2026" \
              -dname "CN=AndrewEllis,OU=Personal,O=PiSSH,C=US"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=PiSSHRelease2026" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=pissh" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=PiSSHRelease2026" >> "$GITHUB_ENV"
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Determine Release Tag
        id: release_info
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.0"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Rename Release APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "PiSSH-${{ env.TAG }}.apk"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiSSH-${{ env.TAG }}-apk
          path: PiSSH-${{ env.TAG }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: PiSSH ${{ env.TAG }}
          files: PiSSH-${{ env.TAG }}.apk
          draft: false
          prerelease: false
          generate_release_notes: true
